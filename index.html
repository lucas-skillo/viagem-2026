<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viagem Ferrari, Souza, Barbosa e Correa · USA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1020; --night2:#121a33; --ink:#0d1530;
  --paper:#fbf7ef; --paper2:#f2ebdc;
  --cream:#fffdf8;
  --gold:#e7a13a; --gold-deep:#c47f1c;
  --coral:#ff5c45; --teal:#15b3a4; --blue:#2f6df0; --violet:#7a55ec; --berry:#9c1b35;
  --line:rgba(13,21,48,.12); --line-l:rgba(255,255,255,.14);
  --green:#2faa5a; --amber:#e8920c; --red:#e2433a;
  --shadow:0 26px 60px -32px rgba(8,14,33,.6);
  --shadow-s:0 14px 30px -20px rgba(8,14,33,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.modal-open{overflow:hidden}
.serif{font-family:'Playfair Display',serif}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600}

/* ===== TOP NAV ===== */
nav.top{
  position:sticky;top:0;z-index:80;backdrop-filter:blur(14px);
  background:rgba(11,16,32,.86);border-bottom:1px solid var(--line-l);
}
nav.top .inner{max-width:1180px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:16px;justify-content:space-between}
nav.top .brand{display:flex;align-items:center;gap:11px;color:#fff;font-weight:700;letter-spacing:.02em;white-space:nowrap;min-width:0}
nav.top .brand .names{overflow:hidden;text-overflow:ellipsis}
nav.top .brand .seal{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 25%,var(--gold),var(--gold-deep));display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 0 3px rgba(231,161,58,.25)}
nav.top .links{display:flex;gap:2px;flex-wrap:wrap}
nav.top .links a{color:rgba(255,255,255,.72);text-decoration:none;font-size:.83rem;font-weight:500;padding:7px 10px;border-radius:100px;transition:.18s;white-space:nowrap}
nav.top .links a:hover{color:#fff;background:rgba(255,255,255,.1)}
@media(max-width:1120px){nav.top .links{display:none}}
@media(max-width:560px){nav.top .brand .names{display:none}}

/* ===== LANGUAGE TOGGLE ===== */
.langtoggle{position:relative;flex:none;display:flex;align-items:center;padding:3px;border-radius:100px;background:rgba(255,255,255,.09);border:1px solid var(--line-l);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.langtoggle .thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);border-radius:100px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));box-shadow:0 6px 16px -8px rgba(231,161,58,.9);transition:transform .28s cubic-bezier(.4,1.3,.5,1)}
.langtoggle[data-active="en"] .thumb{transform:translateX(100%)}
.langtoggle button{position:relative;z-index:1;border:none;background:none;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.66);padding:7px 14px;border-radius:100px;transition:color .22s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.langtoggle button .fl{font-size:.95rem;line-height:1}
.langtoggle button:hover{color:rgba(255,255,255,.9)}
.langtoggle[data-active="pt"] button[data-lang="pt"],
.langtoggle[data-active="en"] button[data-lang="en"]{color:#1a1205}
.langtoggle button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ===== HERO ===== */
.hero{position:relative;min-height:92vh;display:flex;align-items:center;color:#fff;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse at 78% 18%, rgba(231,161,58,.32), transparent 46%),
    radial-gradient(ellipse at 12% 88%, rgba(47,109,240,.30), transparent 50%),
    linear-gradient(150deg,#0a0f1f 0%, #131d3b 48%, #0b1226 100%);
}
.hero .stars{position:absolute;inset:0;z-index:-1;opacity:.5;
  background-image:radial-gradient(1.4px 1.4px at 20% 30%,#fff,transparent),radial-gradient(1.6px 1.6px at 65% 15%,#fff,transparent),radial-gradient(1.2px 1.2px at 80% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 75%,#fff,transparent),radial-gradient(1.1px 1.1px at 90% 40%,#fff,transparent),radial-gradient(1.3px 1.3px at 12% 60%,#fff,transparent);
  background-repeat:repeat;background-size:520px 520px;animation:twinkle 7s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.28}to{opacity:.6}}
.hero .inner{max-width:1180px;margin:0 auto;padding:80px 24px;width:100%}
.hero .eyebrow{color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:11px}
.hero .eyebrow .ln{height:1px;width:46px;background:linear-gradient(90deg,var(--gold),transparent);flex:none}
.hero h1{font-size:clamp(3rem,9.5vw,7.4rem);line-height:.92;font-weight:800;letter-spacing:-.02em}
.hero h1 .amp{font-style:italic;font-weight:500;color:var(--gold)}
.hero h1 .yr{display:block;font-family:'Outfit';font-weight:300;font-size:clamp(1rem,3vw,1.7rem);letter-spacing:.5em;color:rgba(255,255,255,.7);margin-top:18px;padding-left:.5em}
.hero .route{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:clamp(1rem,2.4vw,1.35rem);font-weight:600}
.hero .route .city{position:relative}
.hero .route .city::after{content:"✦";color:var(--gold);margin-left:14px;font-size:.7em;opacity:.8;vertical-align:middle}
.hero .route .city:last-child::after{display:none}
.hero .lede{margin-top:24px;max-width:580px;color:rgba(255,255,255,.78);font-size:1.06rem;line-height:1.6;font-weight:300}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px;animation:bob 2.2s ease-in-out infinite;text-align:center}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}

/* ===== PADRE / CHAPLAIN STRIP ===== */
.padre{background:linear-gradient(100deg,#13182b,#1d2540);color:#fff;position:relative;overflow:hidden}
.padre::before{content:"";position:absolute;right:36px;top:50%;width:90px;height:120px;transform:translateY(-50%);opacity:.06;
  background:
    linear-gradient(var(--gold),var(--gold)) 50% 0/18px 100% no-repeat,
    linear-gradient(var(--gold),var(--gold)) 0 32px/100% 18px no-repeat;}
.padre .inner{max-width:1180px;margin:0 auto;padding:30px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative}
.padre .halo{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,rgba(231,161,58,.4),rgba(231,161,58,.08));box-shadow:0 0 0 2px rgba(231,161,58,.4),0 0 36px rgba(231,161,58,.3)}
.padre .txt{flex:1;min-width:240px}
.padre .txt .lbl{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
.padre .txt .big{font-family:'Playfair Display',serif;font-size:clamp(1.15rem,3vw,1.5rem);font-weight:700;margin-top:4px;font-style:italic}
.padre .txt .sm{color:rgba(255,255,255,.66);font-size:.9rem;margin-top:5px;font-weight:300}
@media(max-width:600px){
  .padre::before{display:none}
  .padre .inner{flex-direction:column;text-align:center;gap:14px;padding:26px 22px}
  .padre .halo{width:54px;height:54px;font-size:1.5rem}
  .padre .txt{min-width:0}
  .padre .txt .lbl{letter-spacing:.16em}
  .padre .txt .big{font-size:1.2rem}
  .padre .txt .sm{font-size:.88rem;line-height:1.5}
}

/* ===== SECTION HEADERS ===== */
section{position:relative}
.sec{padding:78px 0 18px}
section[id]{scroll-margin-top:96px}
.sec-head{margin-bottom:38px}
.sec-head .eyebrow{color:var(--gold-deep)}
.sec-head h2{font-size:clamp(2rem,5.2vw,3.4rem);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin-top:10px}
.sec-head p.intro{margin-top:14px;max-width:680px;color:#4a567a;font-size:1.04rem;line-height:1.6}
.sec-head p.intro b{color:var(--ink)}

/* ===== FLIGHTS ===== */
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.flight{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow-s);position:relative;overflow:hidden}
.flight .pin{position:absolute;top:18px;right:20px;font-size:1.4rem;opacity:.25}
.flight .leg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.18rem;flex-wrap:wrap}
.flight .leg .arr{color:var(--coral)}
.flight .meta{margin-top:14px;display:flex;flex-direction:column;gap:5px;color:#4a567a;font-size:.95rem}
.flight .meta b{color:var(--ink);font-weight:700}
.flight .date-badge{display:inline-block;margin-top:14px;background:var(--ink);color:#fff;font-size:.8rem;font-weight:600;padding:6px 13px;border-radius:100px;letter-spacing:.02em}

/* ===== TIMELINE ===== */
.tl{position:relative;margin-top:8px}
.tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--teal),var(--coral),var(--blue),var(--violet))}
.tl-row{display:flex;gap:20px;padding:9px 0;align-items:flex-start}
.tl-dot{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;z-index:1;box-shadow:0 0 0 5px var(--paper);background:var(--ink)}
.tl-row.hi .tl-dot{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1205;box-shadow:0 0 0 5px var(--paper),0 0 0 7px rgba(231,161,58,.35)}
.tl-row.hi .tl-body{border-color:rgba(231,161,58,.55);background:linear-gradient(120deg,#fff,#fdf3e2)}
.tl-body{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:13px 17px;flex:1;box-shadow:var(--shadow-s);min-width:0}
.tl-body .d{font-weight:700;font-size:.97rem}
.tl-body .c{color:#566189;font-size:.9rem;margin-top:2px}
.tl-leg{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:9px;position:relative;z-index:2}
.tl-leg span:first-child{background:var(--paper);padding:4px 12px 4px 50px;border-radius:100px;white-space:nowrap}
.tl-leg .ln{flex:1;height:1px;background:var(--line)}

/* ===== CITY BANDS ===== */
.city{color:#fff;position:relative;overflow:hidden;padding:78px 0 88px;background:linear-gradient(180deg,var(--band-a),var(--band-b))}
.city .sec-head h2{color:#fff}
.city .sec-head .eyebrow{color:var(--accent)}
.city .sec-head p.intro{color:rgba(255,255,255,.76)}
.city .sec-head p.intro b{color:#fff}
.city-orlando{--band-a:#052e2a;--band-b:#0c4a43;--accent:#4fd6c6}
.city-miami{--band-a:#2a1038;--band-b:#6d2446;--accent:#ff9d7d}
.city-ny{--band-a:#0a0f1f;--band-b:#141d38;--accent:#e7a13a}
.city-washington{--band-a:#101a2c;--band-b:#2b2444;--accent:#b6a5ff}
.amb{position:absolute;inset:0;pointer-events:none}
.amb-sun{background:radial-gradient(circle at 84% 10%,rgba(255,216,128,.30),transparent 44%),radial-gradient(circle at 8% 92%,rgba(31,179,166,.28),transparent 52%)}
.amb-sunset{background:radial-gradient(ellipse at 50% 110%,rgba(255,140,94,.42),transparent 56%),radial-gradient(circle at 88% 6%,rgba(122,85,236,.34),transparent 46%)}
.amb-snow{opacity:.5;
  background-image:radial-gradient(2px 2px at 15% 20%,#fff,transparent),radial-gradient(2px 2px at 45% 50%,#fff,transparent),radial-gradient(2px 2px at 75% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 70%,#fff,transparent),radial-gradient(2px 2px at 30% 80%,#fff,transparent);background-size:300px 300px;animation:fall 9s linear infinite}
@keyframes fall{from{background-position:0 0}to{background-position:0 300px}}
.amb-marble{background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 54px),radial-gradient(circle at 80% 12%,rgba(182,165,255,.24),transparent 46%)}

.city-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(262px,100%),1fr));gap:16px}
.dcard{background:rgba(255,255,255,.055);border:1px solid var(--line-l);border-radius:18px;padding:20px;backdrop-filter:blur(4px);transition:.2s;display:flex;flex-direction:column}
.dcard:hover{background:rgba(255,255,255,.1);transform:translateY(-3px)}
.dcard.tbd{border-style:dashed;background:rgba(255,255,255,.032)}
.dcard .dn{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.dcard .dn .dd{color:rgba(255,255,255,.55);font-weight:600;letter-spacing:.08em}
.dcard .tbdbadge{align-self:flex-start;margin-top:9px;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.78);background:rgba(255,255,255,.1);border:1px solid var(--line-l);padding:3px 9px;border-radius:100px}
.dcard h4{font-family:'Playfair Display',serif;font-size:1.28rem;font-weight:700;margin:7px 0 13px;line-height:1.12}
.dcard ul{list-style:none;display:flex;flex-direction:column;gap:7px;flex:1}
.dcard li{font-size:.9rem;color:rgba(255,255,255,.85);padding-left:20px;position:relative;line-height:1.38}
.dcard li::before{content:"›";position:absolute;left:4px;color:var(--accent);font-weight:700}
.dcard .tip{margin-top:13px;font-size:.82rem;color:var(--accent);background:rgba(255,255,255,.06);border:1px solid var(--line-l);border-radius:10px;padding:9px 12px;line-height:1.4}
.parkbtn{margin-top:14px;width:100%;border:none;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:700;padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1205;box-shadow:0 14px 28px -16px rgba(231,161,58,.85);transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.parkbtn:hover{transform:translateY(-2px)}
.parkbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}

.ny-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media(max-width:680px){.ny-bottom{grid-template-columns:1fr}}
.ny-box{background:rgba(255,255,255,.05);border:1px solid var(--line-l);border-radius:18px;padding:22px}
.ny-box h4{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.ny-box ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.ny-box li{font-size:.9rem;color:rgba(255,255,255,.84);padding-left:22px;position:relative}
.ny-box.reserve li::before{content:"🎟️";position:absolute;left:0;font-size:.8rem}
.ny-box.reserve li a{color:rgba(255,255,255,.9);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;transition:.16s}
.ny-box.reserve li a:hover{color:#fff}
.ny-box.reserve .rlink{font-size:.72rem;font-weight:700;color:var(--accent);background:rgba(231,161,58,.16);border:1px solid rgba(231,161,58,.3);padding:2px 9px;border-radius:100px;white-space:nowrap}
.ny-box.pack li::before{content:"❄️";position:absolute;left:0;font-size:.8rem}

/* ===== MODAL DO PARQUE ===== */
.modal-backdrop{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:18px;background:rgba(5,9,20,.74);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .26s ease,visibility .26s ease}
.modal-backdrop.is-open{opacity:1;visibility:visible}
.modal{width:100%;max-width:1040px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:22px;box-shadow:0 40px 90px -40px rgba(0,0,0,.8);position:relative;padding:0 0 26px;transform:translateY(16px) scale(.985);transition:transform .3s cubic-bezier(.3,1.15,.5,1)}
.modal-backdrop.is-open .modal{transform:none}
.modal-x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.32);color:#fff;font-size:1rem;line-height:1;cursor:pointer;font-family:inherit;transition:.18s;display:grid;place-items:center}
.modal-x:hover{background:rgba(0,0,0,.55);transform:rotate(90deg)}
.modal-x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.modal .park-banner{border-radius:22px 22px 0 0}
.modal .park-tip,.modal .modal-ticket{margin:18px 22px 0}
@media(max-width:560px){.modal .park-tip,.modal .modal-ticket{margin:16px 14px 0}.modal-backdrop{padding:10px}}

/* ===== PARK ===== */
.park-banner{padding:28px 26px 26px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(125deg,#0f8f85 0%,#1fb3a6 55%,#2a7f9e 100%)}
.park-banner::after{content:"";position:absolute;right:-30px;bottom:-50px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.1)}
.park-banner .resort{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.85}
.park-banner h3{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.8rem,4.8vw,2.7rem);line-height:1;margin-top:5px;padding-right:44px}
.park-banner p{margin-top:12px;max-width:700px;font-size:.96rem;line-height:1.55;opacity:.93;font-weight:300;position:relative}
.park-banner .row{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative}
.park-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0c6a62;font-size:.82rem;font-weight:800;padding:8px 15px;border-radius:100px;box-shadow:0 10px 24px -14px rgba(0,0,0,.6);letter-spacing:.02em}
.guide-link{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;padding:7px 14px;border-radius:100px;font-size:.82rem;font-weight:600;transition:.18s}
.guide-link:hover{background:rgba(255,255,255,.3)}
.ride-grid{background:var(--cream);border-top:none;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:14px}
.ride{border:1px solid var(--line);border-radius:15px;padding:16px 16px 14px;background:var(--paper);position:relative;display:flex;flex-direction:column;transition:.2s;overflow:hidden}
.ride::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
.ride:hover{transform:translateY(-3px);box-shadow:var(--shadow-s)}
.ride-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:7px}
.ride h4{font-size:1.04rem;font-weight:700;line-height:1.16;letter-spacing:-.01em}
.lvl{font-size:.64rem;font-weight:800;padding:4px 8px;border-radius:100px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;flex:none}
.lvl.g{background:rgba(47,170,90,.15);color:#1c6d38}
.lvl.m{background:rgba(232,146,12,.16);color:#8a5407}
.lvl.r{background:rgba(226,67,58,.15);color:#b02b23}
.ride p{color:#566189;font-size:.86rem;line-height:1.45;margin-bottom:14px;flex:1}
.pov{text-decoration:none;text-align:center;font-weight:700;font-size:.85rem;background:var(--ink);color:#fff;padding:10px;border-radius:10px;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pov:hover{background:var(--teal)}
.pov svg{width:13px;height:13px;flex:none}
.park-tip{background:linear-gradient(120deg,#fff,#fdf6e9);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:16px 20px;color:#4a567a;font-size:.95rem;line-height:1.55}
.park-tip b{color:var(--ink)}

/* ===== TICKET ===== */
.ticket{position:relative;background:var(--cream);border:2px solid var(--gold);border-radius:20px;padding:30px 26px 26px;box-shadow:0 26px 54px -30px rgba(231,161,58,.65);text-align:center}
.ticket .flag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1205;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:100px;box-shadow:var(--shadow-s)}
.ticket .tt{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#566189}
.ticket .tk-name{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.4rem,4.2vw,1.9rem);letter-spacing:-.02em;margin-top:6px;line-height:1.05}
.ticket .tk-date{display:inline-block;margin-top:12px;background:var(--ink);color:#fff;font-size:.8rem;font-weight:600;padding:6px 14px;border-radius:100px}
.ticket ul{list-style:none;margin:20px auto 22px;display:flex;flex-direction:column;gap:10px;text-align:left;max-width:520px}
.ticket li{font-size:.9rem;color:#4a567a;line-height:1.45;padding-left:24px;position:relative}
.ticket li::before{content:"✦";position:absolute;left:4px;top:0;color:var(--gold-deep);font-size:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;font-weight:700;font-size:.95rem;padding:13px 24px;border-radius:100px;transition:.2s;cursor:pointer;border:none;font-family:inherit}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1205;box-shadow:0 16px 34px -16px rgba(231,161,58,.7);max-width:520px;width:100%}
.btn.gold:hover{transform:translateY(-2px)}
.ticket .note{margin-top:20px;max-width:560px;margin-left:auto;margin-right:auto;color:#4a567a;font-size:.9rem;line-height:1.5;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.ticket .note b{color:var(--ink)}

/* ===== HOUSES ===== */
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.house{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow-s);text-decoration:none;color:inherit;transition:.2s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.house::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.house:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.house .ic{font-size:1.8rem;line-height:1}
.house .hbadge{align-self:flex-start;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:100px;background:rgba(47,170,90,.14);color:#1c6d38}
.house .hbadge.gift{background:linear-gradient(135deg,rgba(231,161,58,.22),rgba(255,92,69,.18));color:#8a5407}
.house .ht{font-family:'Playfair Display',serif;font-weight:700;font-size:1.35rem;letter-spacing:-.01em;line-height:1.05}
.house .hd{font-size:.84rem;font-weight:700;color:var(--accent-ink,var(--accent))}
.house .hs{color:#566189;font-size:.88rem;line-height:1.45}
.house .go{margin-top:auto;padding-top:6px;color:var(--ink);font-weight:700;font-size:.86rem;display:inline-flex;align-items:center;gap:6px}

/* ===== FOOTER ===== */
footer{background:var(--night);color:rgba(255,255,255,.65);text-align:center;padding:54px 24px 60px}
footer .blessing{font-family:'Playfair Display',serif;font-style:italic;font-size:1.25rem;color:#fff;max-width:560px;margin:0 auto 8px;line-height:1.5}
footer .by{font-size:.82rem;margin-top:18px;line-height:1.6}
footer .seal2{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-deep));display:grid;place-items:center;font-size:1.3rem;margin:0 auto 20px;box-shadow:0 0 0 4px rgba(231,161,58,.2)}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .hero .stars,.amb-snow,.scroll-cue{animation:none}
  .langtoggle .thumb,.modal,.modal-backdrop{transition:none}
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function pick(obj, path){
  return path.split('.').reduce((o,k)=> (o && o[k] !== undefined) ? o[k] : undefined, obj);
}

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

function renderFlights(t){
  $('flights').innerHTML = t.flights.map((f,i)=>{
    const m = STATIC.flightMeta[i];
    return '<div class="flight">' +
      '<span class="pin">' + m.pin + '</span>' +
      '<div class="leg"><span>' + esc(f.from) + '</span> <span class="arr">→</span> <span>' + esc(f.to) + '</span></div>' +
      '<div class="meta"><span>' + esc(t.ui.departure) + ' <b>' + esc(f.time) + '</b></span>' +
      '<span>' + esc(t.ui.flight) + ' <b>' + m.voo + '</b></span></div>' +
      '<span class="date-badge">' + esc(f.date) + ' · 2026</span>' +
    '</div>';
  }).join('');
}

function renderTimeline(t){
  $('timeline').innerHTML = STATIC.timeline.map(r=>{
    if(r.leg !== undefined){
      return '<div class="tl-leg" style="color:' + r.color + '"><span>' + esc(t.legs[r.leg]) + '</span><span class="ln"></span></div>';
    }
    return '<div class="tl-row' + (r.hi ? ' hi' : '') + '">' +
      '<div class="tl-dot">' + r.n + '</div>' +
      '<div class="tl-body"><div class="d">' + esc(t.ui.day) + ' ' + r.n + '</div>' +
      '<div class="c">' + t.days[r.i] + '</div></div></div>';
  }).join('');
}

function renderCities(t){
  STATIC.cities.forEach(c=>{
    const ct = t.cities[c.key];
    $('days-' + c.key).innerHTML = ct.days.map((d,i)=>{
      const flag = c.flags[i];
      return '<div class="dcard' + (flag === 'tbd' ? ' tbd' : '') + '">' +
        '<div class="dn">' + esc(t.ui.day) + ' ' + (i+1) + ' <span class="dd">· ' + esc(d.d) + '</span></div>' +
        (flag === 'tbd' ? '<span class="tbdbadge">' + esc(t.ui.tbd) + '</span>' : '') +
        '<h4>' + esc(d.h) + '</h4>' +
        '<ul>' + d.items.map(x=>'<li>' + esc(x) + '</li>').join('') + '</ul>' +
        (flag === 'park' ? '<button type="button" class="parkbtn" data-open-park>🎢 ' + esc(t.ui.openPark) + '</button>' : '') +
        (d.tip ? '<div class="tip">' + esc(d.tip) + '</div>' : '') +
      '</div>';
    }).join('');
  });

  $('nyReserve').innerHTML = t.cities.ny.reserve.map((r,i)=>
    '<li><a href="' + STATIC.nyReserve[i] + '" target="_blank" rel="noopener">' + esc(r) +
    ' <span class="rlink">' + esc(t.cities.ny.reserveCta) + '</span></a></li>').join('');

  $('nyPack').innerHTML = t.cities.ny.pack.map(p=>'<li>' + esc(p) + '</li>').join('');
}

function renderRides(t){
  const LVL = {g:t.ui.levelG, m:t.ui.levelM, r:t.ui.levelR};
  $('rideGrid').innerHTML = t.park.rides.map((ride,i)=>{
    const s = STATIC.rides[i];
    return '<div class="ride">' +
      '<div class="ride-top"><h4>' + esc(ride.n) + '</h4>' +
      '<span class="lvl ' + s.l + '">' + esc(LVL[s.l]) + '</span></div>' +
      '<p>' + esc(ride.d) + '</p>' +
      '<a class="pov" href="' + s.u + '" target="_blank" rel="noopener">' + PLAY_ICON + 'POV</a>' +
    '</div>';
  }).join('');
}

function renderTicket(t){
  $('ticketLines').innerHTML = t.ticket.lines.map(l=>'<li>' + l + '</li>').join('');
}

function renderHouses(t){
  $('houses').innerHTML = t.houses.map((h,i)=>{
    const s = STATIC.houses[i];
    return '<a class="house" style="--accent:' + s.accent + ';--accent-ink:' + s.ink + '" href="' + s.url + '" target="_blank" rel="noopener">' +
      '<span class="ic">' + s.icon + '</span>' +
      '<span class="hbadge' + (s.gift ? ' gift' : '') + '">' + esc(h.tag) + '</span>' +
      '<span class="ht">' + esc(h.city) + '</span>' +
      '<span class="hd">' + esc(h.dates) + '</span>' +
      '<span class="hs">' + esc(h.note) + '</span>' +
      '<span class="go">' + esc(t.ui.openAirbnb) + '</span>' +
    '</a>';
  }).join('');
}

function render(lang){
  const t = I18N[lang] || I18N.pt;

  document.documentElement.lang = (lang === 'en') ? 'en' : 'pt-BR';
  document.title = t.title;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = pick(t, el.getAttribute('data-i18n'));
    if(typeof v === 'string') el.innerHTML = v;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{
    const v = pick(t, el.getAttribute('data-i18n-aria'));
    if(typeof v === 'string') el.setAttribute('aria-label', v);
  });

  $('routeCities').innerHTML = t.hero.cities.map(c=>'<span class="city">' + esc(c) + '</span>').join('');

  renderFlights(t);
  renderTimeline(t);
  renderCities(t);
  renderRides(t);
  renderTicket(t);
  renderHouses(t);

  const tg = $('langToggle');
  tg.dataset.active = lang;
  tg.querySelectorAll('button').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  });
  try { localStorage.setItem('viagem2026:lang', lang); } catch(e) {}
}

/* idioma inicial: o que o visitante escolheu da última vez, senão PT */
let saved = null;
try { saved = localStorage.getItem('viagem2026:lang'); } catch(e) {}
render(saved === 'en' ? 'en' : 'pt');

$('langToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(btn) render(btn.dataset.lang);
});

/* =====================================================================
   MODAL DO PARQUE
   ===================================================================== */
const parkModal = $('parkModal');
let modalOpener = null;

function openPark(trigger){
  modalOpener = trigger || null;
  parkModal.classList.add('is-open');
  parkModal.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
  $('parkModalClose').focus();
}
function closePark(){
  if(!parkModal.classList.contains('is-open')) return;
  parkModal.classList.remove('is-open');
  parkModal.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
  if(modalOpener && typeof modalOpener.focus === 'function') modalOpener.focus();
  modalOpener = null;
}

document.addEventListener('click', (e)=>{
  const opener = e.target.closest('[data-open-park]');
  if(opener){ e.preventDefault(); openPark(opener); return; }
  if(e.target === parkModal || e.target.closest('#parkModalClose')) closePark();
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closePark();
});

/* prende o Tab dentro do modal enquanto ele estiver aberto */
parkModal.addEventListener('keydown', (e)=>{
  if(e.key !== 'Tab') return;
  const f = parkModal.querySelectorAll('a[href], button:not([disabled])');
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ---- REVEAL ON SCROLL ---- */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
}, {threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
